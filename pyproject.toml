[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spectro"
version = "1.0.0"
description = "Extractor de absorbancia desde video de la pantalla del espectrofotometro"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "opencv-python",
    "imageio-ffmpeg",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
